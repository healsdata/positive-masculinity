# DigitalOcean App Platform spec (free static site).
# Create once with:  doctl apps create --spec .do/app.yaml
# or in the DO control panel: Create App -> GitHub -> this repo (settings below match).
# Replace OWNER with your GitHub username/org before using.
name: positive-masculinity
static_sites:
  - name: site
    github:
      repo: OWNER/positive-masculinity
      branch: main
      deploy_on_push: true
    environment_slug: hugo
    build_command: hugo --gc --minify
    output_dir: public
    envs:
      - key: HUGO_VERSION
        value: "0.145.0"
        scope: BUILD_TIME
